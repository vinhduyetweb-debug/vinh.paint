<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4cc">
  <title>Bé Tô Màu - Animals V2</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<main class="app">
  <header class="header">
    <div>
      <h1>🎨 Bé Tô Màu</h1>
      <p>Chọn mẫu động vật, upload ảnh, tô màu và lưu ảnh</p>
    </div>
  </header>

  <section id="canvasBox" class="canvasBox">
    <canvas id="paintCanvas"></canvas>
    <canvas id="lineCanvas"></canvas>
    <div id="toast" class="toast">Chọn màu rồi kéo trên tranh để tô</div>
  </section>

  <section class="toolbar">
    <div class="row compact">
      <label class="btn primary">📷 Upload
        <input id="imageInput" type="file" accept="image/*" hidden>
      </label>
      <button id="lineBtn" class="btn">✏️ Nét chì</button>
      <button id="saveBtn" class="btn good">💾 Lưu</button>
      <button id="brushBtn" class="btn active">🖌️ Cọ</button>
      <button id="eraserBtn" class="btn">🧽 Gôm</button>
      <button id="undoBtn" class="btn">↶</button>
      <button id="resetBtn" class="btn danger">↺</button>
    </div>

    <div id="sampleStrip" class="sampleStrip"></div>

    <div class="bottomTools">
      <div id="palette" class="palette"></div>
      <label class="rangeLabel">Cỡ cọ
        <input id="sizeRange" type="range" min="4" max="80" value="26">
      </label>
    </div>
  </section>
</main>
<script src="app.js?v=2"></script>
</body>
</html>
