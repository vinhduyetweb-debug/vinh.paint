<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Magic Coloring App</title>
<link rel="stylesheet" href="style.css">
<script defer src="app.js"></script>
</head>
<body>

<header class="topbar">
<h1>🎨 Magic Coloring</h1>

<div class="coins">
🪙 <span id="coins">0</span>
</div>
</header>

<section class="daily-challenge">
<h2>🎯 Daily Challenge</h2>
<p>Tô màu chú mèo hôm nay để nhận +50 coins</p>
</section>

<section class="canvas-section">

<div class="character">
<div id="character">🐱</div>
</div>

<div class="color-palette">

<button class="color-btn" style="background:#ef4444"
onclick="paint('#ef4444')"></button>

<button class="color-btn" style="background:#3b82f6"
onclick="paint('#3b82f6')"></button>

<button class="color-btn" style="background:#22c55e"
onclick="paint('#22c55e')"></button>

<button class="color-btn" style="background:#f59e0b"
onclick="paint('#f59e0b')"></button>

<button class="color-btn" style="background:#a855f7"
onclick="paint('#a855f7')"></button>

</div>

<button class="magic-btn"
onclick="unlockReward()">
✨ Unlock Magic Pack
</button>

</section>

<section class="reward-box">
<h3>🏆 Unlockables</h3>

<div class="rewards">
<div class="reward">🌈 Rainbow Pack</div>
<div class="reward">🦄 Unicorn Pack</div>
<div class="reward">🚀 Space Pack</div>
</div>
</section>

<div id="confetti" class="hidden">
🎉✨🌈🎊
</div>

</body>
</html>
