<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4cc">
  <title>Bé Tô Màu - Working</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="header">
    <div>
      <h1>🎨 Bé Tô Màu</h1>
      <p>Bản sửa lại hoàn toàn: tô trên canvas riêng, nét ở lớp trên</p>
    </div>
  </header>

  <section id="canvasBox" class="canvasBox">
    <canvas id="paintCanvas"></canvas>
    <canvas id="lineCanvas"></canvas>
    <div id="toast" class="toast">Chọn màu rồi kéo trên tranh để tô</div>
  </section>

  <section class="toolbar">
    <div class="row">
      <label class="btn primary">📷 Upload ảnh
        <input id="imageInput" type="file" accept="image/*" hidden>
      </label>
      <button id="sampleBtn" class="btn">🐱 Mẫu</button>
      <button id="lineBtn" class="btn">✏️ Nét chì</button>
      <button id="saveBtn" class="btn good">💾 Lưu</button>
    </div>

    <div id="palette" class="palette"></div>

    <div class="row">
      <button id="brushBtn" class="btn active">🖌️ Cọ</button>
      <button id="eraserBtn" class="btn">🧽 Gôm</button>
      <button id="undoBtn" class="btn">↶ Undo</button>
      <button id="resetBtn" class="btn danger">↺ Làm lại</button>
    </div>

    <label class="rangeLabel">Cỡ cọ
      <input id="sizeRange" type="range" min="4" max="80" value="26">
    </label>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
