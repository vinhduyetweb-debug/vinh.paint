<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4cc">
  <title>Bé Tô Màu Pro Fixed</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="header">
    <div>
      <h1>🎨 Bé Tô Màu Pro</h1>
      <p>Bản đã sửa lỗi tô màu trên điện thoại/iPad</p>
    </div>
    <button id="fullscreenBtn" class="roundBtn">⛶</button>
  </header>

  <section class="canvasShell">
    <canvas id="paintCanvas"></canvas>
    <div id="toast" class="toast"></div>
  </section>

  <section class="toolbar">
    <div class="scrollRow">
      <label class="bigBtn uploadBtn">📷 Upload ảnh
        <input id="imageInput" type="file" accept="image/*" hidden>
      </label>
      <button id="sampleBtn" class="bigBtn">🐱 Mẫu</button>
      <button id="lineBtn" class="bigBtn">✏️ Nét chì</button>
      <button id="saveBtn" class="bigBtn good">💾 Lưu</button>
      <button id="shareBtn" class="bigBtn">📤 Chia sẻ</button>
    </div>

    <div id="palette" class="palette"></div>

    <div class="scrollRow">
      <button id="brushBtn" class="bigBtn active">🖌️ Cọ</button>
      <button id="eraserBtn" class="bigBtn">🧽 Gôm</button>
      <button id="bucketBtn" class="bigBtn">🪣 Đổ màu</button>
      <button id="undoBtn" class="bigBtn">↶ Undo</button>
      <button id="redoBtn" class="bigBtn">↷ Redo</button>
      <button id="resetBtn" class="bigBtn danger">↺ Làm lại</button>
    </div>

    <div class="settings">
      <label>Cỡ cọ <input id="sizeRange" type="range" min="4" max="80" value="24"></label>
      <label>Độ nét <input id="edgeRange" type="range" min="30" max="180" value="85"></label>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
