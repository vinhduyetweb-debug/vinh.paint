<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bé Tô Màu</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <h1>Bé Tô Màu</h1>
        <p>Tô một chút, vui cả ngày ✨</p>
      </div>
      <div class="mascot">🦁</div>
    </header>

    <section class="worlds">
      <button class="world active">🦁 Safari</button>
      <button class="world">🐠 Đại dương</button>
      <button class="world">🦕 Dino</button>
    </section>

    <section class="canvas-card">
      <div class="toolbar">
        <button>🖌 Cọ</button>
        <button>✏ Bút lông</button>
        <button>🖍 Sáp màu</button>
        <button>✨ Kim tuyến</button>
      </div>

      <div class="palette">
        <span class="color" style="background:#FF6B6B"></span>
        <span class="color" style="background:#FFD93D"></span>
        <span class="color" style="background:#6BCB77"></span>
        <span class="color" style="background:#4D96FF"></span>
        <span class="color" style="background:#FF6B9A"></span>
      </div>

      <div class="canvas-placeholder">
        <div class="animal">🦒</div>
        <p>Canvas tô màu nâng cấp</p>
      </div>

      <button id="finishBtn" class="finish-btn">
        🎉 Hoàn thành tranh
      </button>
    </section>

    <section class="daily">
      <h2>🔥 Daily Challenge</h2>
      <p>Hôm nay tô màu chú voi để nhận sticker!</p>
    </section>
  </div>

  <div id="celebration" class="celebration hidden">
    <div class="popup">
      <h2>🎉 Bé tô đẹp quá!</h2>
      <p>Nhận được sticker cầu vồng ✨</p>
      <button onclick="closePopup()">Tiếp tục</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
